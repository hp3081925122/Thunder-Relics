// 当前文件只保留最小的 NeoForge 开发、构建和运行配置。
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // CurseMaven 提供已核对的 GeckoLib 4.9.2 NeoForge 文件。
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 26.1.2 暂未提供 GeckoLib 兼容构件，旧版特效与装备实现先保存在源码中并从本分支编译集排除。
sourceSets.main.java {
    exclude 'org/hp/thunderrelics/RoyalEquipmentEvents.java'
    exclude 'org/hp/thunderrelics/client/RoyalCourtDebug.java'
    exclude 'org/hp/thunderrelics/client/RoyalEquipmentModel.java'
    exclude 'org/hp/thunderrelics/client/RoyalGlaiveRenderer.java'
    exclude 'org/hp/thunderrelics/client/RoyalSlashDebug.java'
    exclude 'org/hp/thunderrelics/client/RoyalSlashRenderer.java'
    exclude 'org/hp/thunderrelics/client/RoyalStormRenderer.java'
    exclude 'org/hp/thunderrelics/client/ThrownRoyalWeaponRenderer.java'
    exclude 'org/hp/thunderrelics/client/ThunderBossOverlay.java'
    exclude 'org/hp/thunderrelics/client/ThunderKingModel.java'
    exclude 'org/hp/thunderrelics/entity/RoyalStormWave.java'
    exclude 'org/hp/thunderrelics/entity/ThrownRoyalWeapon.java'
    exclude 'org/hp/thunderrelics/effect/DecorativeLightning.java'
    exclude 'org/hp/thunderrelics/item/RoyalArmorItem.java'
    exclude 'org/hp/thunderrelics/item/RoyalGlaiveItem.java'
    exclude 'org/hp/thunderrelics/world/ThunderCourtBuilder.java'
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    // GeckoLib 4.9.2 提供 26.1.2 NeoForge 的骨骼动画运行时。
    // 26.1.2 当前没有可确认的 GeckoLib 构件，待官方发布兼容版本后再恢复依赖。
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}




