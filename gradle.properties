# 当前模板面向 Minecraft 1.20.1 Forge。
org.gradle.jvmargs=-Xmx3G
# ForgeGradle 启动时不再执行易受网络阻塞影响的服务器证书预检，依赖解析仍按仓库正常进行。
systemProp.net.minecraftforge.gradle.check.certs=false
# 复用 Gradle Daemon，避免每次 runClient 都重新启动单次构建进程。
org.gradle.daemon=true

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=thunderrelics
mod_name=Thunder Relics
mod_license=All Rights Reserved
mod_version=1.0.2
mod_group_id=org.hp.thunderrelics
mod_authors=HP
mod_description=Adds the Thunder King creature and its GeckoLib animations.
